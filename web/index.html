<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Diktiertool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    // Blockierend als erstes Element im body, nicht in app.js: verhindert
    // ein kurzes Aufblitzen des falschen Designs, bevor app.js (am Ende der
    // Seite) geladen ist.
    var savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark" || savedTheme === "glass") document.body.classList.add(savedTheme);
  </script>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="header">
      <h1>Diktiertool</h1>
      <span class="version" id="versionLabel" title="Release-Seite öffnen"></span>
      <span class="update-badge" id="updateBadge" hidden></span>
      <div class="header-actions">
      <button class="icon-btn" id="settingsToggle" type="button" title="Einstellungen" aria-label="Einstellungen öffnen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="icon-btn theme-toggle" id="themeToggle" type="button" title="Design wechseln">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.582a.5.5 0 0 1 0 .962L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>
      </button>
      </div>
    </div>

    <div class="main-view" id="mainView">
    <div class="controls-row">
      <select class="device-select" id="deviceSelect"></select>
      <button class="btn-secondary" id="refreshButton">Aktualisieren</button>
    </div>

    <button class="btn-primary" id="startButton" disabled>Start</button>

    <div class="status" id="status">Initialisiere...</div>

    <div class="level-meter">
      <div class="level-fill" id="levelFill"></div>
    </div>

    <div class="text-output" id="textOutput">
      <p class="placeholder" id="placeholder">Erkannter Text erscheint hier …</p>
    </div>

    <div class="text-actions">
      <button class="btn-secondary btn-small" id="copyButton" type="button" disabled>Kopieren</button>
      <button class="btn-secondary btn-small" id="clearButton" type="button" disabled
              title="Leert nur die Anzeige – die Datei bleibt unverändert">Leeren</button>
      <button class="btn-secondary btn-small" id="folderButton" type="button">Ordner öffnen</button>
    </div>
    </div>

    <div class="settings-view" id="settingsView" hidden>
      <h2>Einstellungen</h2>

      <label class="field">
        <span class="field-label">Spracherkennungsmodell</span>
        <select class="device-select" id="modelSelect">
          <option value="small">small – schnell (Standard)</option>
          <option value="medium">medium – genauer, deutlich langsamer</option>
          <option value="large-v3-turbo">large-v3-turbo – am genauesten, braucht am meisten Speicher</option>
        </select>
        <span class="field-hint" id="modelHint"></span>
      </label>

      <label class="field">
        <span class="field-label">Sprache</span>
        <select class="device-select" id="languageSelect">
          <option value="de">Deutsch</option>
          <option value="en">Englisch</option>
          <option value="auto">Automatisch erkennen</option>
        </select>
      </label>

      <div class="field">
        <span class="field-label">Ausgabeordner</span>
        <div class="path-row">
          <span class="path" id="outputDir"></span>
          <button class="btn-secondary btn-small" id="chooseDirButton" type="button">Ändern …</button>
          <button class="btn-secondary btn-small" id="resetDirButton" type="button"
                  title="Zurück zum Standardordner">Standard</button>
        </div>
      </div>

      <label class="check">
        <input type="checkbox" id="filePerSession">
        <span>
          Für jede Aufnahme eine eigene Datei
          <span class="field-hint">z. B. diktat_2026-10-10_14-30.txt statt alles nacheinander in diktat.txt</span>
        </span>
      </label>

      <label class="check">
        <input type="checkbox" id="punctuationCommands">
        <span>
          Satzzeichen per Sprache
          <span class="field-hint">„Komma“, „Punkt“, „Fragezeichen“ … werden zum Zeichen – leider auch
            in „der Punkt ist …“.</span>
        </span>
      </label>

      <label class="field">
        <span class="field-label">Eigene Wörter</span>
        <textarea class="vocabulary" id="vocabulary" rows="2" spellcheck="false"
                  placeholder="Ein Begriff pro Zeile, z. B. Namen oder Fachwörter"></textarea>
        <span class="field-hint">Hilft bei Namen und Fachbegriffen. Wenige gezielte Wörter wirken am besten.</span>
      </label>

      <div class="settings-footer">
        <span class="field-hint">Änderungen werden sofort gespeichert.</span>
        <button class="btn-secondary" id="settingsDone" type="button">Fertig</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
