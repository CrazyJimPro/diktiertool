<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Diktiertool</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <script>
    // Blockierend als erstes Element im body, nicht in app.js: verhindert
    // ein kurzes Aufblitzen des hellen Designs, bevor app.js (am Ende der
    // Seite) geladen ist, wenn eigentlich Dunkel gespeichert war.
    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");
  </script>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="header">
      <h1>Diktiertool</h1>
      <span class="version" id="versionLabel" title="Release-Seite öffnen"></span>
      <span class="update-badge" id="updateBadge" hidden></span>
      <button class="theme-toggle" id="themeToggle" type="button" title="Design wechseln">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>

    <div class="controls-row">
      <select class="device-select" id="deviceSelect"></select>
      <button class="btn-secondary" id="refreshButton">Aktualisieren</button>
    </div>

    <button class="btn-primary" id="startButton" disabled>Start</button>

    <div class="status" id="status">Initialisiere...</div>

    <div class="level-meter">
      <div class="level-fill" id="levelFill"></div>
    </div>

    <div class="text-output" id="textOutput">
      <p class="placeholder" id="placeholder">Erkannter Text erscheint hier …</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
